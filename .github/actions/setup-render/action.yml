name: Set up screenshot rendering
description: >-
  Installs everything scripts/announce.py needs to render a submission
  screenshot: the freeze binary (cached), plus rsvg-convert and the font
  freeze's SVG asks for.

inputs:
  freeze-version:
    description: charmbracelet/freeze release to install. Bump deliberately.
    default: "0.2.2"

runs:
  using: composite
  steps:
    # freeze rasterizes its SVG with rsvg-convert when it's on PATH, and
    # otherwise with resvg-compiled-to-wasm, which has segfaulted mid-render
    # (Go's GC walking the wasm stack — see FREEZE_ENV in announce.py). Both
    # produce the same pixel dimensions, so this only buys reliability.
    # fonts-jetbrains-mono is what makes them look the same too: the wasm path
    # carries JetBrains Mono inside the binary, while rsvg-convert resolves
    # the SVG's font-family through fontconfig and would otherwise substitute
    # something with different metrics than freeze laid the text out for.
    - name: Install rsvg-convert and JetBrains Mono
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          librsvg2-bin fonts-jetbrains-mono

    - name: Cache freeze binary
      id: freeze-cache
      uses: actions/cache@v4
      with:
        path: ~/.local/bin/freeze
        key: freeze-${{ runner.os }}-${{ inputs.freeze-version }}

    - name: Install freeze
      if: steps.freeze-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        FREEZE_VERSION: ${{ inputs.freeze-version }}
      run: |
        curl -sL \
          "https://github.com/charmbracelet/freeze/releases/download/v${FREEZE_VERSION}/freeze_${FREEZE_VERSION}_Linux_x86_64.tar.gz" \
          -o /tmp/freeze.tar.gz
        tar -xzf /tmp/freeze.tar.gz -C /tmp
        mkdir -p ~/.local/bin
        mv "/tmp/freeze_${FREEZE_VERSION}_Linux_x86_64/freeze" ~/.local/bin/freeze
        chmod +x ~/.local/bin/freeze

    - name: Add freeze to PATH
      shell: bash
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
