name: Analyze submissions

on:
  push:
    branches: [main]
    paths:
      - "Data Structures & Algorithms/**"
  workflow_dispatch: {}

# Rapid consecutive exports used to race: two runs would analyze in
# parallel, both commit, and the loser's rebase could hit a real conflict
# on summary.json (and the announce step could double-post). Queue them.
concurrency:
  group: analyze-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    # A hung step doesn't just lose its own run: this workflow is serialized on
    # a concurrency group, so it holds the lock and every submission pushed
    # behind it is cancelled while queued (only one run may be pending, so each
    # new trigger evicts the last). That happened on 2026-08-18 — a wedged
    # render setup ran out the default 6h timeout and silently swallowed two
    # problems. An incremental run finishes in under two minutes, but the
    # bound has to clear the worst legitimate case, not the usual one: an
    # ANALYSIS_VERSION bump re-analyzes every submission, and at the 36s per
    # record measured on 2026-08-19 that is ~46 minutes for 77 of them and
    # grows with the corpus. A job timeout is a cancellation, so even the
    # commit step's `if: always()` would not save the work. 90 still ends a
    # wedge decisively -- the one that started this ran past four hours --
    # and the render step carries its own far tighter bound below.
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward to the tip of the branch
        # checkout pins the run to its triggering commit, and an export push
        # is the *parent* of the previous run's analysis commit even when it
        # arrives after it in wall-clock time. So a run triggered while the
        # previous one was still working starts from a tree where that run's
        # records do not exist yet -- analyze.py sees no analysis file, calls
        # the submission new, re-analyzes it, and announce.py posts it to
        # Discord a second time. That happened three times on 2026-08-21:
        # course-schedule submission-0 and submission-9 were each analyzed
        # and announced in two consecutive runs.
        #
        # Safe because the concurrency group above serializes runs: by the
        # time a queued run reaches this step, the previous one has already
        # pushed. Moving forward can only mean analyzing submissions that
        # arrived after our trigger, which is the same work the run behind us
        # would have done -- it then finds nothing new and stays quiet.
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"

      - uses: actions/setup-python@v5
        with:
          # 3.14+: lazy annotation evaluation (PEP 649) — some solutions have
          # annotations that would raise if evaluated eagerly (e.g. `tuple(int)`)
          python-version: "3.14"

      - name: Install submission dependencies
        # Not for the scripts, which are stdlib-only -- for the submissions
        # themselves, which benchmark.py execs directly. Two of them import
        # numpy (climbing-stairs submission-2 does the whole problem with
        # matrix_power), and NeetCode's judge has it. continue-on-error
        # because this is an enhancement, not a requirement: if no wheel is
        # available for the runner's Python, those submissions record an
        # import error and every other one is measured as usual.
        continue-on-error: true
        run: python3 -m pip install --quiet numpy

      - name: Run analysis
        id: analysis
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MOONSHOT_MODEL: ${{ vars.MOONSHOT_MODEL }}
          MOONSHOT_BASE_URL: ${{ vars.MOONSHOT_BASE_URL }}
          # Fallback provider, used only when the call above fails — in
          # practice the Kimi-for-Coding subscription hitting its 5-hour
          # quota, which it reports as a 403, not a 429. Billed per token, so
          # it costs nothing on a normal run. Unset is fine: the fallback is
          # skipped and the recorded error says it wasn't configured.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: python3 scripts/analyze.py

      - name: Run benchmarks
        id: benchmarks
        env:
          # CPython only reads PYTHONHASHSEED at interpreter startup, so it
          # has to be set on the step's env (not e.g. os.environ inside the
          # script) — benchmark.py also re-execs itself defensively if it
          # detects this wasn't set.
          PYTHONHASHSEED: "0"
        run: python3 scripts/benchmark.py

      - name: Commit and push analysis
        # Ahead of the render and announce steps on purpose. Analysis and
        # benchmark results are the durable output; the screenshot is
        # cosmetic. Ordered the other way, a hang or failure in the render
        # setup threw away a completed analysis pass — which is exactly what
        # happened on 2026-08-18, when eating-bananas submission-2 was
        # analyzed and benchmarked at 00:43:50 and then lost.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis
          # --cached: new analysis files are untracked, plain `git diff` misses them
          if git diff --cached --quiet -- analysis/; then
            exit 0
          fi
          git commit -m "Analyze: update analysis/"

          # A NeetCode export, or another run, may have pushed while we ran.
          # -X theirs resolves in favour of the commit being replayed — this
          # run's own freshly generated analysis. That matters after an
          # ANALYSIS_VERSION bump, when every run rewrites every file and two
          # overlapping runs conflict on all of them: both sides are equally
          # valid regenerated output, so picking one is right and stopping is
          # not. Failing here loses the whole pass — and since this now runs
          # before the announcement, the channel stays quiet about a
          # submission the site never received, rather than claiming it
          # landed.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            git pull --rebase -X theirs || {
              git rebase --abort || true
              exit 1
            }
          done
          git push

      - name: Set up screenshot rendering
        # Only meaningful when we're about to try rendering an image, i.e.
        # analysis actually succeeded — see the announce step's condition.
        # Effectively all apt-get: on 2026-08-18 the freeze binary came from
        # cache in 1.8s while `apt-get update` plus the two packages took
        # 2m37s, 2m34s of which was silent fetching from the runner's mirrors
        # before a ~3s unpack. That fetch is also what hung for hours earlier
        # the same day, so the hang looks like the tail of this distribution
        # rather than a distinct failure: 20s typical, 2m37s seen, unbounded
        # seen. Hence a bound generous against the slow case (10m) but still
        # decisive against the stuck one, under the job's own 30.
        if: always() && steps.analysis.outcome == 'success'
        timeout-minutes: 10
        uses: ./.github/actions/setup-render

      - name: Announce new submissions
        # Runs whether or not benchmarking succeeded — a benchmark failure
        # shouldn't swallow an otherwise-good analysis announcement — but
        # skipped outright if the analysis step itself failed, since that's
        # what actually produces the new-submissions list and source
        # records announce.py reads. `if: always()` alone isn't enough
        # (it would also fire after a failed analysis step); checking
        # steps.analysis.outcome directly is unambiguous about which
        # failure this is meant to tolerate. (announce.py still posts if
        # freeze is missing or fails — better a bare embed than silence —
        # but exits non-zero so the imageless post shows up here too.)
        if: always() && steps.analysis.outcome == 'success'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 scripts/announce.py
