name: Analyze submissions

on:
  push:
    branches: [main]
    paths:
      - "Data Structures & Algorithms/**"
  workflow_dispatch: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run analysis
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MOONSHOT_MODEL: ${{ vars.MOONSHOT_MODEL }}
        run: python3 scripts/analyze.py

      - name: Commit and push analysis
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet -- analysis/ || (git add analysis && git commit -m "Analyze: update analysis/" && git push)
